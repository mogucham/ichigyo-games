<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIに1行で作らせたゲーム</title>
<style>
  body{margin:0;font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c",system-ui,sans-serif;background:#9ED9B8;color:#1F2A44}
  main{max-width:560px;margin:0 auto;padding:32px 20px 48px}
  h1{font-size:28px;margin:0 0 6px}
  p.lead{margin:0 0 24px}
  a.game{display:block;background:#fff;border-radius:18px;padding:18px 20px;margin:0 0 14px;color:inherit;text-decoration:none;box-shadow:0 5px 0 rgba(31,42,68,.15)}
  a.game b{font-size:22px;display:block}
  a.game span{font-size:14px;opacity:.8}

<body>
<main>
  <h1>AIに1行で作らせたゲーム</h1>
  <p class="lead">YouTubeショートで作ったゲームを、ここで遊べます。スマホでどうぞ。</p>
  <a class="game" href="medamayaki/"><b>目玉焼き返し</b><span>上にスワイプして、黄身を割らずに裏返そう（Claude で作成）</span></a>
  <a class="game" href="onigiri/"><b>三角おにぎり道場</b><span>ゲージが金色のときにタップして、きれいな三角ににぎろう（Claude で作成）</span></a>
  <footer>ゲームはAI（Claude）が作ったものです。</footer>
</main>

</html>
