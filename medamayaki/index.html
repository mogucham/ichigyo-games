<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>目玉焼き返し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 台所の小さな腕試し。明るく、ちょっとおかしい
   IDEA: タイル張りのコンロ前。フライパンひとつと卵ひとつ
   PICTURE: 横から見たフライパン・炎・宙を舞う目玉焼きを画面いっぱいに
   COLOUR and TYPE: 深い青緑のタイル＋白い卵＋黄身の黄＋トマト赤のアクセント / Mochiy Pop One + M PLUS Rounded
   LAYOUT: 全画面キャンバス、上にスコア、左に強さゲージ、中央に結果 */
:root{color-scheme:light dark;--wall:light-dark(#1f6f8b,#0f3442);--ink:#fff;--accent:#ff5a3c;--yolk:#ffc93c;--panel:light-dark(rgba(8,40,52,.55),rgba(0,0,0,.5))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wall);color:var(--ink);font:16px/1.5 "M PLUS Rounded 1c",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.chip{background:var(--panel);border-radius:14px;padding:6px 12px;font-weight:800;font-size:15px;white-space:nowrap;backdrop-filter:blur(4px)}
.chip b{font-family:"Mochiy Pop One",sans-serif;font-weight:400;font-size:22px;margin-inline-start:4px}
.eggs{letter-spacing:2px;font-size:18px}
.right{display:flex;gap:8px;align-items:flex-start}
.mute{pointer-events:auto;appearance:none;border:0;color:#fff;font:800 15px "M PLUS Rounded 1c",sans-serif;min-height:44px;min-width:44px;cursor:pointer}
.mute:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.mute[aria-pressed=true]{opacity:.6;text-decoration:line-through}
.gauge{position:fixed;left:12px;top:50%;transform:translateY(-50%);width:22px;height:min(42vh,300px);border-radius:12px;background:var(--panel);pointer-events:none;overflow:visible}
.gauge .danger{position:absolute;left:0;right:0;top:0;border-radius:12px 12px 0 0;background:repeating-linear-gradient(45deg,rgba(255,90,60,.75) 0 5px,rgba(255,90,60,.35) 5px 10px)}
.gauge .band,.gauge .perfect{position:absolute;left:3px;right:3px;border-radius:6px;transition:opacity .3s}
.gauge .band{background:rgba(255,201,60,.55)}.gauge .perfect{background:var(--yolk)}
.gauge .mark{position:absolute;left:-6px;right:-6px;height:4px;margin-top:-2px;background:#fff;border-radius:2px;box-shadow:0 0 0 2px rgba(0,0,0,.35);transition:top .25s}
.gauge .lbl{position:absolute;left:28px;font-size:12px;white-space:nowrap;opacity:.85}
.msg{position:fixed;left:0;right:0;top:19%;text-align:center;pointer-events:none;padding:0 20px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.msg h2{margin:0;font:400 clamp(32px,9vw,52px)/1.05 "Mochiy Pop One",sans-serif;text-wrap:balance}
.msg p{margin:6px 0 0;font-weight:800;font-size:17px}
.msg .pts{color:var(--yolk);font-family:"Mochiy Pop One",sans-serif;font-size:24px}
.msg.pop h2{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.hint{position:fixed;left:0;right:0;bottom:max(18px,4vh);text-align:center;font-weight:800;font-size:16px;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.3);transition:opacity .3s}
.hint .arrow{display:block;font-size:30px;line-height:1;animation:up 1.1s ease-in-out infinite}
@keyframes up{0%,100%{transform:translateY(6px);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(6,30,40,.55);backdrop-filter:blur(3px)}
.overlay[hidden]{display:none}
.card{background:#fff;color:#16323d;border-radius:28px;padding:28px 24px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 18px 0 -6px rgba(0,0,0,.18)}
.card h1{margin:0 0 6px;font:400 clamp(32px,10vw,44px)/1.05 "Mochiy Pop One",sans-serif;color:#16323d;text-wrap:balance}
.card .big{font:400 52px/1 "Mochiy Pop One",sans-serif;color:var(--accent);margin:8px 0}
.card ul{text-align:left;padding-left:1.2em;margin:12px 0 18px;font-size:15px}
.card li{margin:4px 0}
.btn{appearance:none;border:0;border-radius:999px;background:var(--accent);color:#fff;font:400 20px "Mochiy Pop One",sans-serif;min-height:52px;padding:0 32px;cursor:pointer;box-shadow:0 5px 0 #c23a20}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c23a20}
.btn:focus-visible{outline:3px solid var(--yolk);outline-offset:3px}
.small{font-size:13px;opacity:.7;margin-top:12px}
@media (prefers-reduced-motion:reduce){.hint .arrow,.msg.pop h2{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="フライパンと目玉焼き"></canvas>

<div class="hud">
  <div class="chip">スコア<b id="score">0</b></div>
  <div class="chip" id="eggInfo">Mサイズ</div>
  <div class="right">
    <div class="chip eggs" id="lives" aria-label="残りの卵">🥚🥚🥚</div>
    <button class="chip mute" id="muteBtn" aria-pressed="false" aria-label="音のオン・オフ">♪ 音</button>
  </div>
</div>

<div class="gauge" aria-hidden="true">
  <div class="danger" id="gDanger"></div>
  <div class="band" id="gBand" style="opacity:0"></div>
  <div class="perfect" id="gPerf" style="opacity:0"></div>
  <div class="mark" id="gMark" style="opacity:0"></div>
  <div class="lbl" style="top:-2px">強</div>
  <div class="lbl" style="bottom:-2px">弱</div>
</div>

<div class="msg" id="msg"></div>
<div class="hint" id="hint"><span class="arrow">↑</span>上にスワイプして裏返す</div>

<div class="overlay" id="title">
  <div class="card">
    <h1>目玉焼き返し</h1>
    <ul>
      <li>画面を<b>上にスワイプ</b>して卵を宙に放る</li>
      <li>スワイプが速いほど高く、よく回る</li>
      <li>ちょうど半回転で着地すれば成功</li>
      <li>高すぎたり斜めに落ちると黄身が割れる</li>
      <li>飛んでいる間は<b>左右ドラッグ</b>でフライパンを動かせる</li>
      <li>大きい卵ほど回りにくい。卵は3個</li>
    </ul>
    <button class="btn" id="startBtn">焼きはじめる</button>
    <div class="small" id="bestTitle"></div>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="card">
    <h1>卵がなくなった</h1>
    <div class="big" id="finalScore">0</div>
    <div id="finalSub"></div>
    <p class="small" id="bestOver"></p>
    <button class="btn" id="againBtn">もう一度</button>
  </div>
</div>

<script>
{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);if(S&&S.mode!=='flying')S.panX=Math.min(Math.max(S.panX||W/2,panR()*.5),W-panR()*.5);}
const panR=()=>Math.min(W*.36,190);
const Y0=()=>H*.64;
const eggBase=()=>Math.min(panR()*.46,82);
const PB=Math.sqrt(.62/.6); // これ以上の強さだと割れる
const GMAX=1.2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let best=0;try{best=+localStorage.getItem('eggflip-best')||0}catch(e){}
const S={mode:'title',score:0,lives:3,combo:0,round:0,egg:null,panX:0,wind:0,parts:[],timer:0,time:0};
const ro=new ResizeObserver(resize);ro.observe(cv);resize();S.panX=W/2;

/* ===== 音（Web Audio で合成。外部ファイルなし） ===== */
let AC=null,master=null,bgmG=null,sfxG=null,sizzleG=null,noiseBuf=null,muted=false,bgmTimer=0,bgmStep=0,bgmNext=0;
try{muted=localStorage.getItem('eggflip-mute')==='1'}catch(e){}
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
  bgmG=AC.createGain();bgmG.gain.value=.16;bgmG.connect(master);
  sfxG=AC.createGain();sfxG.gain.value=.7;sfxG.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  startSizzle();startBgm();
}
function tone(f,t,dur,type='sine',vol=.3,to=null,dest=sfxG){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02);
}
function noise(t,dur,vol,ftype,f,f2=null,q=1,dest=sfxG){
  const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;s.loop=true;fl.type=ftype;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(dest);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function startSizzle(){
  const s=AC.createBufferSource(),hp=AC.createBiquadFilter(),lfo=AC.createOscillator(),lg=AC.createGain();
  s.buffer=noiseBuf;s.loop=true;hp.type='highpass';hp.frequency.value=3200;
  sizzleG=AC.createGain();sizzleG.gain.value=.025;
  lfo.frequency.value=7;lg.gain.value=.01;lfo.connect(lg);lg.connect(sizzleG.gain);
  s.connect(hp);hp.connect(sizzleG);sizzleG.connect(master);s.start();lfo.start();
}
function sizzleSwell(amt){if(!AC)return;const t=AC.currentTime,g=sizzleG.gain;g.cancelScheduledValues(t);g.setValueAtTime(.025+amt,t);g.linearRampToValueAtTime(.025,t+1.2)}
/* BGM：ハ長調の軽いループ（8分音符×32） */
const MEL=[72,0,76,79,76,0,72,74, 76,0,74,72,69,0,72,0, 72,0,76,79,81,79,76,0, 79,76,74,76,72,0,0,0];
const BASS=[48,55,48,55, 53,60,53,60, 45,52,45,52, 43,50,43,50];
const STEP=60/132/2;
function startBgm(){bgmNext=AC.currentTime+.1;bgmStep=0;clearInterval(bgmTimer);bgmTimer=setInterval(schedBgm,25)}
function schedBgm(){
  if(!AC||AC.state!=='running')return;
  while(bgmNext<AC.currentTime+.15){
    const t=bgmNext,i=bgmStep%32,m=MEL[i];
    if(m){tone(mtof(m),t,STEP*1.6,'square',.12,null,bgmG);tone(mtof(m+12),t,STEP*.8,'triangle',.05,null,bgmG)}
    if(i%2===0)tone(mtof(BASS[i/2]),t,STEP*1.8,'triangle',.32,null,bgmG);
    noise(t,.04,i%4===2?.12:.05,'highpass',7000,null,1,bgmG);
    bgmNext+=STEP;bgmStep++;
  }
}
function bgmLevel(v){if(bgmG)bgmG.gain.setTargetAtTime(v,AC.currentTime,.3)}
function setMuted(m){
  muted=m;$('muteBtn').setAttribute('aria-pressed',m);$('muteBtn').textContent=m?'♪ 消音':'♪ 音';
  try{localStorage.setItem('eggflip-mute',m?'1':'0')}catch(e){}
  if(master)master.gain.setTargetAtTime(m?0:1,AC.currentTime,.05);
}
const SFX={
  click(){const t=AC.currentTime;tone(880,t,.08,'square',.15);tone(1320,t+.06,.1,'square',.12)},
  launch(p){const t=AC.currentTime;noise(t,.3,.35,'bandpass',400,2400*Math.min(p+.4,1.6),2);tone(260,t,.25,'sine',.25,520+p*500)},
  plop(){const t=AC.currentTime;tone(200,t,.15,'sine',.5,80);noise(t,.08,.25,'lowpass',900)},
  perfect(c){const t=AC.currentTime+.08,k=Math.pow(2,(c-1)/12*2);[1046,1318,1568,2093].forEach((f,i)=>tone(f*k,t+i*.07,.35,'triangle',.22))},
  good(c){const t=AC.currentTime+.08,k=Math.pow(2,(c-1)/12*2);tone(880*k,t,.2,'triangle',.22);tone(1318*k,t+.09,.3,'triangle',.22)},
  same(){const t=AC.currentTime+.05;tone(330,t,.18,'sine',.25,250);tone(294,t+.16,.25,'sine',.22,220)},
  crack(){const t=AC.currentTime;for(let i=0;i<3;i++)noise(t+i*.035,.03,.5,'bandpass',2600+i*500,null,3);noise(t+.08,.35,.45,'lowpass',1400,200);tone(392,t+.25,.18,'square',.1,370);tone(330,t+.45,.4,'square',.1,196)},
  whistle(){const t=AC.currentTime;tone(1000,t,.6,'sine',.18,180)},
  splat(){const t=AC.currentTime;noise(t,.4,.6,'lowpass',1800,150);tone(120,t,.2,'sine',.4,50)},
  bonk(){const t=AC.currentTime;tone(150,t,.25,'square',.22,60);noise(t,.3,.6,'lowpass',2200,200);tone(523,t+.3,.12,'square',.08);tone(494,t+.42,.3,'square',.08,330)},
  crash(){const t=AC.currentTime;noise(t,.7,.6,'bandpass',3200,700,1);for(let i=0;i<6;i++)tone(2000+Math.random()*3000,t+i*.045,.09,'triangle',.08);tone(90,t,.45,'sine',.5,40)},
  twinkle(){const t=AC.currentTime;[2093,2637,3136,4186].forEach((f,i)=>tone(f,t+i*.07,.6,'sine',.14))},
  frisbee(){const t=AC.currentTime;noise(t,.6,.3,'bandpass',700,3200,2);tone(500,t,.8,'triangle',.14,1600)},
  over(){const t=AC.currentTime+.1;[67,64,60,55].forEach((m,i)=>tone(mtof(m),t+i*.22,.4,'triangle',.25))}
};
function sfx(name,...a){if(!AC||muted)return;try{SFX[name](...a)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!AC)return;document.hidden?AC.suspend():AC.resume()});
$('muteBtn').addEventListener('click',ev=>{ev.stopPropagation();initAudio();setMuted(!muted);if(!muted)sfx('click')});
setMuted(muted);

function isDark(){const t=document.documentElement.dataset.theme;return t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)}

function makeShape(){return Array.from({length:14},()=>Math.random()*.12-.05)}
function sizeLabel(s){return s<.95?'Sサイズ':s<1.1?'Mサイズ':'Lサイズ'}

function newRound(){
  S.round++;
  const s=S.round===1?1:.82+Math.random()*.42;
  S.wind=S.round>=4?(Math.random()<.5?-1:1)*W*Math.min(.04+.03*(S.round-4),.22)*(.5+Math.random()*.5):0;
  S.panX=W/2;
  S.egg={s,R:eggBase()*(.8+.25*s),x:W/2,y:Y0(),a:0,state:'ready',shape:makeShape(),spill:0,settle:0};
  S.mode='ready';
  $('eggInfo').textContent=sizeLabel(s)+(S.wind?(S.wind>0?'　風→':'　←風'):'');
  $('gBand').style.opacity=0;$('gPerf').style.opacity=0;
  $('hint').style.opacity=1;
  showMsg('');
}

function launch(p,vxs){
  const e=S.egg,h=p*p*.6*H,g=2.4*H;
  e.p=p;e.h=h;e.g=g;e.T=Math.sqrt(8*h/g);e.th=p*p*360/e.s;
  e.vx=clamp(vxs*1000*.22,-W*.6,W*.6)+S.wind;
  e.x0=e.x;e.t=0;e.state='fly';S.mode='flying';
  $('hint').style.opacity=0;
  setMark(p);sfx('launch',p);
}

function launchFrisbee(vxs){
  const e=S.egg;e.state='frisbee';S.mode='flying';e.t=0;e.fp=0;
  e.vx=Math.sign(vxs)*Math.max(Math.abs(vxs)*1000*.7,W*1.1);e.vy=-H*.35;
  $('hint').style.opacity=0;$('gMark').style.opacity=0;sfx('frisbee');
}
function special(h,sub,time){S.combo=0;S.lives--;showMsg(h,sub);updateHud();S.mode='result';S.timer=time;}
function setMark(p){const m=$('gMark');m.style.opacity=1;m.style.top=(100-clamp(p/GMAX,0,1)*100)+'%'}
function showBand(s){
  const pp=deg=>Math.sqrt(deg/360*s);
  const set=(el,lo,hi)=>{el.style.bottom=(pp(lo)/GMAX*100)+'%';el.style.height=((pp(hi)-pp(lo))/GMAX*100)+'%';el.style.opacity=1};
  set($('gBand'),142,218);set($('gPerf'),166,194);
}
$('gDanger').style.height=((1-PB/GMAX)*100)+'%';

function showMsg(h,sub,pts){
  const m=$('msg');m.classList.remove('pop');
  m.innerHTML=h?`<h2>${h}</h2>${sub?`<p>${sub}</p>`:''}${pts?`<p class="pts">+${pts}</p>`:''}`:'';
  if(h){void m.offsetWidth;m.classList.add('pop')}
}

function burst(x,y,col,n,spd){for(let i=0;i<n;i++){const a=-Math.PI*Math.random();S.parts.push({x,y,vx:Math.cos(a)*spd*(.4+Math.random()),vy:Math.sin(a)*spd*(.5+Math.random()),life:.6+Math.random()*.5,col,r:2+Math.random()*3})}}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

function land(){
  const e=S.egg;e.t=e.T;e.y=Y0();e.x=e.x0+e.vx*e.T;
  const off=Math.abs(e.x-S.panX)>panR()*.92-e.R*.35;
  const m=((e.th%360)+360)%360,d180=Math.abs(m-180),d0=Math.min(m,360-m);
  let r;
  showBand(e.s);
  if(off){r={type:'fall',h:'床に落ちた…',sub:'フライパンで受け止めよう'};e.state='fall';e.fv=Math.sqrt(2*e.g*e.h);e.spin=e.th/e.T}
  else if(e.h>.62*H){r={type:'break',h:'高すぎ！',sub:'落ちた衝撃で黄身が割れた'};e.state='broken';e.a=180*Math.round(e.th/180)}
  else if(d180<=14){r={type:'ok',h:'パーフェクト！',sub:'きれいに裏返った',base:300};e.state='ok'}
  else if(d180<=38){r={type:'ok',h:'ナイス！',sub:'ちょっと斜めだけど成功',base:100};e.state='ok'}
  else if(d0<=25){r={type:'same',h:e.th<180?'回りきらなかった':'回りすぎて元どおり',sub:'黄身は無事。もう一回'};e.state='same'}
  else{r={type:'break',h:'黄身が割れた…',sub:m<180?'回転が足りず、ふちから落ちた':'回りすぎて、ふちから落ちた'};e.state='broken';e.a=e.th}
  e.from=e.th;e.settle=0;
  if(r.type==='ok'){S.combo=Math.min(S.combo+1,5);const pts=r.base*S.combo;S.score+=pts;showMsg(r.h,r.sub+(S.combo>1?`　${S.combo}連続`:''),pts);sfx('plop');sfx(r.base===300?'perfect':'good',S.combo);sizzleSwell(.08);burst(e.x,Y0(),'#fff6d0',14,H*.5);buzz(20)}
  else if(r.type==='same'){S.combo=0;showMsg(r.h,r.sub);burst(e.x,Y0(),'#fff6d0',6,H*.3);sfx('plop');sfx('same');sizzleSwell(.05)}
  else{S.combo=0;S.lives--;showMsg(r.h,r.sub);if(r.type==='break'){burst(e.x,Y0(),'#ffc93c',18,H*.55);buzz([30,40,60]);sfx('crack');sizzleSwell(.06)}else sfx('whistle')}
  updateHud();
  S.mode='result';S.timer=r.type==='fall'?2:1.7;
}

function updateHud(){
  $('score').textContent=S.score;
  $('lives').textContent='🥚'.repeat(Math.max(S.lives,0))+'・'.repeat(3-Math.max(S.lives,0));
}

function gameOver(){
  S.mode='over';sfx('over');bgmLevel(.05);
  const nb=S.score>best;if(nb){best=S.score;try{localStorage.setItem('eggflip-best',best)}catch(e){}}
  $('finalScore').textContent=S.score;
  $('finalSub').textContent=`${S.round}個目まで焼いた`;
  $('bestOver').textContent=nb?'自己ベスト更新！':`ベスト ${best}`;
  $('over').hidden=false;
}

function start(){
  initAudio();sfx('click');bgmLevel(.16);
  S.score=0;S.lives=3;S.combo=0;S.round=0;S.parts=[];
  $('title').hidden=true;$('over').hidden=true;$('gMark').style.opacity=0;
  updateHud();newRound();
}
$('startBtn').addEventListener('click',start);
$('againBtn').addEventListener('click',start);
if(best)$('bestTitle').textContent=`ベスト ${best}`;

/* 入力 */
let pts=[],drag=null;
cv.addEventListener('pointerdown',ev=>{
  try{cv.setPointerCapture(ev.pointerId)}catch(e){}
  initAudio();
  const t=performance.now();pts=[{x:ev.clientX,y:ev.clientY,t}];drag={x:ev.clientX,px:S.panX};
});
cv.addEventListener('pointermove',ev=>{
  if(!drag)return;
  const t=performance.now();pts.push({x:ev.clientX,y:ev.clientY,t});
  while(pts.length>2&&t-pts[0].t>140)pts.shift();
  if(S.mode==='flying')S.panX=clamp(drag.px+(ev.clientX-drag.x),panR()*.5,W-panR()*.5);
});
function release(ev){
  if(!drag)return;
  const start0=drag;drag=null;
  if(S.mode!=='ready')return;
  const t=performance.now();
  let p0=pts[0];for(const q of pts){if(t-q.t<=100){p0=q;break}}
  const dt=Math.max(16,t-p0.t),vy=(p0.y-ev.clientY)/dt,vxs=(ev.clientX-p0.x)/dt;
  const total=(pts.length?pts[0].y:ev.clientY)-ev.clientY;
  const dxTot=ev.clientX-start0.x;
  if(Math.abs(vxs)>.7&&Math.abs(vxs)>Math.max(vy,0)*1.8&&Math.abs(dxTot)>W*.12){launchFrisbee(vxs);return}
  if(vy>.05&&(total>H*.03||vy>.6)){launch(clamp(vy/(H*.0045),.1,1.8),vxs)}
  void start0;
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',()=>{drag=null});

/* 更新 */
function update(dt){
  S.time+=dt;if(S.shake>0)S.shake=Math.max(0,S.shake-dt);
  const e=S.egg;
  if(e&&e.state==='fly'){
    e.t+=dt;const f=Math.min(e.t/e.T,1);
    e.y=Y0()-4*e.h*f*(1-f);e.a=e.th*f;e.x=e.x0+e.vx*e.t;
    if(e.p>=1.5&&e.y<-e.R*2){
      e.state='star';e.starT=0;e.hx=clamp(e.x,40,W-40);sfx('crash');S.shake=.6;
      special('天井を突き破った！','卵は星になった…',2.8);
    }else if(e.p>=1.3&&e.p<1.5&&e.y<=e.R*.3){
      e.state='ceil';e.y=0;e.drip=0;e.spill=1;sfx('bonk');sfx('splat');S.shake=.4;burst(e.x,6,'#ffc93c',12,H*.25);buzz([40,30,40]);
      special('天井に貼りついた！','高く投げすぎ。しばらく取れなさそう…',2.4);
    }else if(e.x-e.R*.6<0||e.x+e.R*.6>W){
      e.side=e.x<W/2?-1:1;e.x=e.side<0?0:W;e.wy0=e.y;e.state='wall';e.spill=1;sfx('splat');S.shake=.3;
      burst(e.x,e.y,'#ffc93c',12,H*.3);buzz([30,40,60]);
      special('壁に焼きついた！','横に投げすぎ。ずるずる…',2.4);
    }else if(e.t>=e.T)land();
  }else if(e&&e.state==='frisbee'){
    e.t+=dt;e.fp+=dt*28;e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=H*.18*dt;e.a=Math.sin(e.t*22)*10;e.yo=Math.sin(e.fp)*e.R*.45;
    if(S.mode==='flying'&&(e.x<-e.R*2||e.x>W+e.R*2)){e.state='gone';special('フリスビーじゃない！','卵は窓の外へ飛んでいった…',2)}
  }else if(e&&e.state==='ceil'){e.drip=Math.min(e.drip+dt*.45,1)
  }else if(e&&e.state==='wall'){e.y=Math.min(e.y+H*.05*dt,H*.9)
  }else if(e&&e.state==='star'){const was=e.starT;e.starT+=dt;if(was<1.1&&e.starT>=1.1)sfx('twinkle')
  }else if(e&&e.state==='fall'){
    e.fv+=e.g*dt;e.y+=e.fv*dt;e.x+=e.vx*dt;e.a+=e.spin*dt;
    if(e.y>H*.93){e.y=H*.93;e.state='splat';e.spill=0;burst(e.x,e.y,'#ffc93c',16,H*.5);buzz([30,40,60]);sfx('splat')}
  }else if(e&&(e.state==='ok'||e.state==='same')){
    e.settle=Math.min(e.settle+dt/.3,1);
    const target=e.state==='ok'?180*Math.round((e.from-180)/360)*2+180:360*Math.round(e.from/360);
    e.a=e.from+(target-e.from)*(1-Math.pow(1-e.settle,3));
  }
  if(e&&(e.state==='broken'||e.state==='splat'))e.spill=Math.min(e.spill+dt*2.2,1);
  for(const q of S.parts){q.vy+=H*1.4*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt}
  S.parts=S.parts.filter(q=>q.life>0);
  if(S.mode==='result'){S.timer-=dt;if(S.timer<=0){if(S.lives<=0)gameOver();else newRound()}}
}

/* 描画 */
function drawWall(dark){
  const tile=Math.max(36,Math.min(W,H)/9);
  ctx.fillStyle=dark?'#0f3442':'#1f6f8b';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=dark?'rgba(255,255,255,.06)':'rgba(255,255,255,.18)';ctx.lineWidth=2;
  ctx.beginPath();for(let x=tile/2;x<W;x+=tile){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<H;y+=tile){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
  const g=ctx.createRadialGradient(W/2,Y0(),10,W/2,Y0(),Math.max(W,H)*.8);
  g.addColorStop(0,dark?'rgba(255,170,80,.16)':'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(0,0,0,.25)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // コンロ
  const top=Y0()+panR()*.42;
  ctx.fillStyle=dark?'#a8b3b8':'#e9eef0';ctx.fillRect(0,top,W,H-top);
  ctx.fillStyle=dark?'#c9d2d6':'#ffffff';ctx.fillRect(0,top,W,6);
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(0,top+6,W,4);
}
function drawFlames(cx,y,r){
  for(let i=0;i<9;i++){
    const x=cx-r*.55+i*r*1.1/8,fl=reduce?1:.75+.35*Math.sin(S.time*18+i*1.7)+.1*Math.sin(S.time*31+i);
    const h=r*.22*fl;
    ctx.beginPath();ctx.moveTo(x-r*.05,y);ctx.quadraticCurveTo(x-r*.03,y-h*.6,x,y-h);ctx.quadraticCurveTo(x+r*.03,y-h*.6,x+r*.05,y);ctx.closePath();
    const g=ctx.createLinearGradient(0,y,0,y-h);g.addColorStop(0,'#2f6bff');g.addColorStop(.6,'#7fb2ff');g.addColorStop(1,'rgba(180,220,255,0)');
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.fillStyle='#2a2d31';ctx.fillRect(cx-r*.75,y,r*1.5,r*.06);
}
function drawPan(cx){
  const r=panR(),ry=r*.22,cy=Y0()+eggBase()*.14,d=r*.17;
  drawFlames(cx,cy+d+r*.2,r);
  // 取っ手
  ctx.save();ctx.translate(cx+r*.9,cy+d*.2);ctx.rotate(-.12);
  ctx.fillStyle='#2b2b2f';ctx.fillRect(0,-r*.045,r*.25,r*.09);
  const hg=ctx.createLinearGradient(0,-r*.06,0,r*.06);hg.addColorStop(0,'#a8683c');hg.addColorStop(1,'#6b3c1f');
  ctx.fillStyle=hg;ctx.beginPath();ctx.roundRect(r*.22,-r*.065,r*.75,r*.13,r*.065);ctx.fill();
  ctx.restore();
  // 胴
  ctx.fillStyle='#1d1d21';
  ctx.beginPath();ctx.ellipse(cx,cy+d,r*.86,ry*.9,0,0,Math.PI);ctx.lineTo(cx-r,cy);ctx.ellipse(cx,cy,r,ry,0,Math.PI,0,true);ctx.closePath();ctx.fill();
  // ふち
  ctx.fillStyle='#34343a';ctx.beginPath();ctx.ellipse(cx,cy,r,ry,0,0,Math.PI*2);ctx.fill();
  const ig=ctx.createLinearGradient(0,cy-ry,0,cy+ry);ig.addColorStop(0,'#2a2a2f');ig.addColorStop(1,'#46464d');
  ctx.fillStyle=ig;ctx.beginPath();ctx.ellipse(cx,cy+2,r*.9,ry*.78,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,230,160,.08)';ctx.beginPath();ctx.ellipse(cx-r*.25,cy,r*.35,ry*.3,0,0,Math.PI*2);ctx.fill();
  return {cy,ry};
}
function eggPath(R,shape){
  ctx.beginPath();const n=shape.length;
  for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,k=1+shape[i%n],x=Math.cos(a)*R*k,y=Math.sin(a)*R*.15*(1+shape[i%n]*.5);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  ctx.closePath();
}
function drawEgg(e){
  const R=e.R;
  ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.a*Math.PI/180);
  eggPath(R,e.shape);
  const g=ctx.createLinearGradient(0,-R*.17,0,R*.17);
  g.addColorStop(0,'#ffffff');g.addColorStop(.5,'#fbf7ee');g.addColorStop(.78,'#e8bb72');g.addColorStop(1,'#b5743a');
  ctx.fillStyle=g;ctx.fill();
  const yg=ctx.createRadialGradient(-R*.18,-R*.3,R*.02,-R*.08,-R*.12,R*.42);
  yg.addColorStop(0,'#ffe58a');yg.addColorStop(.5,'#ffc23a');yg.addColorStop(1,'#ef8e17');
  ctx.fillStyle=yg;ctx.beginPath();ctx.ellipse(-R*.08+(e.yo||0),-R*.08,R*.36,R*.3,0,Math.PI,Math.PI*2);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.ellipse(-R*.2+(e.yo||0),-R*.27,R*.07,R*.035,-.3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawSpill(e,y,rot){
  const R=e.R,k=e.spill;
  ctx.save();ctx.translate(e.x,y);if(rot)ctx.rotate(rot);
  ctx.fillStyle='#fbf7ee';ctx.beginPath();ctx.ellipse(0,0,R*(1+.15*k),R*.17,0,0,Math.PI*2);ctx.fill();
  const yg=ctx.createRadialGradient(0,-2,2,0,0,R*.9);yg.addColorStop(0,'#ffd24a');yg.addColorStop(1,'#f39a1c');
  ctx.fillStyle=yg;ctx.beginPath();
  const n=10;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,rr=R*(.25+.6*k)*(1+e.shape[i%n]*1.5);const x=Math.cos(a)*rr+R*.1,yy=Math.sin(a)*rr*.2-R*.03;i?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}
  ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawCeil(e){
  const R=e.R;
  ctx.fillStyle='#ffc93c';ctx.strokeStyle='#ffc93c';ctx.lineCap='round';
  [[-.35,1],[.1,.65],[.4,1.25]].forEach(([o,l],i)=>{
    const len=e.drip*R*l*(1+.08*Math.sin(S.time*3+i)),x=e.x+o*R;
    ctx.lineWidth=R*.08;ctx.beginPath();ctx.moveTo(x,R*.1);ctx.lineTo(x,R*.1+len);ctx.stroke();
    ctx.beginPath();ctx.arc(x,R*.1+len,R*.08,0,Math.PI*2);ctx.fill();
  });
  drawSpill(e,R*.08,Math.PI);
}
function drawWallSplat(e){
  const x=e.side<0?0:W,w=e.R*.35;
  ctx.fillStyle='rgba(255,214,120,.45)';ctx.fillRect(e.side<0?0:W-w,e.wy0,w,Math.max(0,e.y-e.wy0));
  drawSpill(e,e.y,e.side<0?Math.PI/2:-Math.PI/2);
}
function drawStar(e){
  const x=e.hx,k=e.R/55;
  const P=[[-60,0],[-50,20],[-34,12],[-22,38],[-4,24],[12,44],[28,18],[46,30],[62,0]];
  ctx.fillStyle='#0b1530';ctx.beginPath();P.forEach(([a,b],i)=>{i?ctx.lineTo(x+a*k,b*k):ctx.moveTo(x+a*k,b*k)});ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';[[-24,8,1.6],[10,14,1.2],[30,7,1.8],[-6,30,1]].forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(x+a*k,b*k,r*k,0,Math.PI*2);ctx.fill()});
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(x-60*k,0);ctx.lineTo(x-90*k,14*k);ctx.moveTo(x+62*k,0);ctx.lineTo(x+95*k,20*k);ctx.moveTo(x+12*k,44*k);ctx.lineTo(x+18*k,66*k);ctx.stroke();
  if(e.starT>1.1){
    const t=e.starT-1.1,sx=x+(W/2-x)*.25+40*k,sy=H*.1,r=(14+7*Math.sin(t*9))*k*Math.min(t*3,1);
    ctx.save();ctx.translate(sx,sy);ctx.rotate(t*1.5);ctx.fillStyle='#fff6c0';ctx.beginPath();
    for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*.3:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}
    ctx.closePath();ctx.fill();ctx.restore();
    ctx.fillStyle='#fff';ctx.font='800 15px "M PLUS Rounded 1c",sans-serif';ctx.textAlign='center';ctx.globalAlpha=Math.min(t*2,1);
    ctx.fillText('キラーン',sx,sy+r+20);ctx.globalAlpha=1;
  }
}
function drawSteam(cx,cy){
  if(reduce)return;
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=4;ctx.lineCap='round';
  for(let i=0;i<3;i++){const ph=(S.time*.35+i/3)%1,x=cx-panR()*.4+i*panR()*.4,y=cy-ph*H*.22;
    ctx.globalAlpha=Math.sin(ph*Math.PI);ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x+12,y-16,x-12,y-32,x,y-48);ctx.stroke()}
  ctx.globalAlpha=1;
}
function draw(){
  const dark=isDark(),sh=S.shake>0&&!reduce;
  if(sh){ctx.save();const a=26*S.shake;ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a)}
  drawWall(dark);
  const e=S.egg;
  if(e&&e.state==='splat')drawSpill(e,e.y);
  const {cy}=drawPan(S.panX);
  drawSteam(S.panX,cy);
  if(e){
    if(e.state==='fly'){
      const k=clamp(1-(Y0()-e.y)/(H*.6),.15,1);
      ctx.fillStyle=`rgba(0,0,0,${.35*k})`;ctx.beginPath();ctx.ellipse(e.x,cy+2,e.R*.9*k,e.R*.12*k,0,0,Math.PI*2);ctx.fill();
    }
    if(e.state==='broken')drawSpill(e,e.y);
    else if(e.state==='ceil')drawCeil(e);
    else if(e.state==='wall')drawWallSplat(e);
    else if(e.state==='star')drawStar(e);
    else if(e.state==='frisbee'){
      ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;ctx.lineCap='round';
      for(let i=0;i<3;i++){const yy=e.y+(i-1)*e.R*.15,dx=-Math.sign(e.vx);ctx.beginPath();ctx.moveTo(e.x+dx*e.R*1.2,yy);ctx.lineTo(e.x+dx*e.R*(2+i*.4),yy);ctx.stroke()}
      drawEgg(e);
    }
    else if(e.state!=='splat'&&e.state!=='gone')drawEgg(e);
    if(e.state==='fly'&&e.y<-e.R){ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(e.x,8);ctx.lineTo(e.x-10,24);ctx.lineTo(e.x+10,24);ctx.fill()}
  }
  for(const q of S.parts){ctx.globalAlpha=clamp(q.life*2,0,1);ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;
  if(sh)ctx.restore();
  if(S.mode==='title'&&!S.egg){drawEgg({x:S.panX,y:Y0(),a:0,R:eggBase(),shape:demoShape})}
}
const demoShape=makeShape();

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.033);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}
</script>
